name: Sign macOS

# CONSULO-BUILD.txt contains build number, each change of it - signs that build
# "SNAPSHOT" - signs latest release with mac archives, but never uploads to hub (dmg only in workflow artifacts)
# manual run - signs build from CONSULO-BUILD.txt again
on:
  push:
    branches: [ master ]
    paths: [ CONSULO-BUILD.txt ]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ mac64, macA64 ]
    env:
      VARIANT: ${{ matrix.variant }}
      # hub cuts last extension for id: consulo.dist.macA64.dmg.dmg -> consulo.dist.macA64.dmg
      DMG_FILE: consulo.dist.${{ matrix.variant }}.dmg.dmg
      HUB_DEPLOY_URL: ${{ vars.HUB_DEPLOY_URL || 'https://api.consulo.io/repository/platformDeploy' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VALUE=$(tr -d '[:space:]' < CONSULO-BUILD.txt)
          SNAPSHOT=false
          if [ "$VALUE" = SNAPSHOT ]; then
            SNAPSHOT=true
            BUILD=$(gh api 'repos/consulo/consulo/releases?per_page=50' --jq '[.[]
              | select(.draft | not)
              | select(.tag_name | test("^consulo#[0-9]+$"))
              | select(any(.assets[]; .name | startswith("consulo.dist.macA64_")) and any(.assets[]; .name | startswith("consulo.dist.mac64_")))
              | .tag_name | ltrimstr("consulo#") | tonumber] | max')
          else
            BUILD=$VALUE
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Bad value in CONSULO-BUILD.txt: '$VALUE' (build '$BUILD'), expected build number or SNAPSHOT"
            exit 1
          fi
          echo "Build: $BUILD, snapshot: $SNAPSHOT"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          # Developer ID certificates are valid only 1 year
          CERT=$(security find-certificate -c "$MAC_SIGN_IDENTITY" -p "$KEYCHAIN")
          echo "Certificate $(echo "$CERT" | openssl x509 -noout -enddate)"
          if ! echo "$CERT" | openssl x509 -noout -checkend 0 >/dev/null; then
            echo "::error::Developer ID certificate expired - renew it and update MAC_CERT_P12_BASE64"
            exit 1
          fi
          if ! echo "$CERT" | openssl x509 -noout -checkend $((30 * 86400)) >/dev/null; then
            echo "::warning::Developer ID certificate expires in less than 30 days - renew it and update MAC_CERT_P12_BASE64"
          fi

      - name: Write notary key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Download unsigned build
        run: curl -fL --retry 3 -o "$RUNNER_TEMP/unsigned.tar.gz" "https://github.com/consulo/consulo/releases/download/consulo%23$BUILD/consulo.dist.${VARIANT}_$BUILD.tar.gz"

      # TEMP: codesign treats any file directly in Contents/ as nested code ("code object is not signed at all").
      # Launcher reads Contents/consulo.properties and Contents/consulo.vmoptions - move them to Resources/
      # and keep symlinks. Remove after launchers read them from Resources/ (and user home)
      - name: Relocate Contents files (temporary)
        run: |
          DIR="$RUNNER_TEMP/relocate"
          mkdir -p "$DIR"
          tar -xzf "$RUNNER_TEMP/unsigned.tar.gz" -C "$DIR"
          for f in "$DIR"/*.app/Contents/*; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            name=$(basename "$f")
            case "$name" in Info.plist|PkgInfo) continue ;; esac
            resources="$(dirname "$f")/Resources"
            mkdir -p "$resources"
            mv "$f" "$resources/$name"
            ln -s "Resources/$name" "$f"
            echo "Contents/$name -> Contents/Resources/$name"
          done
          (cd "$DIR" && COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/unsigned.tar.gz" *)
          rm -rf "$DIR"

      - name: Sign, notarize, staple
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./macos/sign-mac.sh "$RUNNER_TEMP/unsigned.tar.gz" out "$DMG_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: consulo.dist.${{ matrix.variant }}.dmg_${{ env.BUILD }}
          path: out/*
          retention-days: 7

      # new id for existing build - hub puts it in same channels as consulo.dist.<variant> of this build
      # and attaches to existing github release consulo#BUILD
      - name: Deploy to hub
        # deploy only when hub supports dmg ids, and never for snapshot
        if: vars.HUB_DEPLOY_ENABLED == 'true' && env.SNAPSHOT != 'true'
        env:
          HUB_DEPLOY_USER: ${{ secrets.HUB_DEPLOY_USER }}
          HUB_DEPLOY_PASSWORD: ${{ secrets.HUB_DEPLOY_PASSWORD }}
        run: |
          TAGS=$(git ls-remote --tags https://github.com/consulo/consulo "refs/tags/consulo#$BUILD" "refs/tags/consulo#$BUILD^{}")
          # annotated tag - prefer peeled commit
          SHA=$(echo "$TAGS" | grep '\^{}$' | cut -f1)
          SHA=${SHA:-$(echo "$TAGS" | head -n 1 | cut -f1)}
          printf '{"repoUrl":"https://github.com/consulo/consulo","commitSha1":"%s"}' "$SHA" > "$RUNNER_TEMP/github.json"

          curl -fsS --max-time 1800 -u "$HUB_DEPLOY_USER:$HUB_DEPLOY_PASSWORD" \
            -F "file=@out/$DMG_FILE;type=application/x-apple-diskimage" \
            -F "github=@$RUNNER_TEMP/github.json;type=application/json" \
            "$HUB_DEPLOY_URL?platformVersion=$BUILD"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
